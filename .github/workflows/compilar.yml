name: Compilar APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Instalar Cython (El traductor faltante)
        run: pip3 install Cython==0.29.33 virtualenv
      
      - name: Build APK
        uses: digreatbrian/buildozer-action@v2
        with:
          python-version: '3.10'
          buildozer-cmd: buildozer -v android debug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: mi-juego-apk
          path: ./bin/*.apk
